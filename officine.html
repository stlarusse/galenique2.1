<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Comptoir — fiches conseils officine</title>
<meta name="theme-color" content="#8a1538">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238a1538'/%3E%3Cpath d='M7 15h18a9 9 0 0 1-18 0zM19 13l5-8' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#fbf1f4; --panel:#ffffff; --ink:#2a1a20; --muted:#7c6a70; --line:#ecd9df;
  --brand:#8a1538; --brand-2:#a6234a; --brand-soft:#f8dfe6; --brand-softer:#fdf0f3;
  --green:#3f7d2c; --green-soft:#eef5e6; --green-line:#d6e6c6;
  --warn:#b4540a; --radius:16px; --shadow:0 1px 2px rgba(90,20,40,.06),0 8px 24px rgba(90,20,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Avenir Next","Nunito Sans","Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- barre du haut ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;color:var(--brand);letter-spacing:-.01em;white-space:nowrap}
.logo span{font-weight:400}
.logo svg{width:34px;height:34px;stroke:var(--brand);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:6px;margin-left:auto}
.tab{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;font-weight:600;color:var(--ink)}
.tab:hover{background:var(--brand-softer)}
.tab.on{background:var(--brand-soft);color:var(--brand)}
.save-state{font-size:.78rem;color:var(--green);opacity:0;transition:opacity .3s;white-space:nowrap}
.save-state.show{opacity:1}

/* ---------- mise en page ---------- */
.app{max-width:1280px;margin:0 auto;padding:16px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:76px;display:flex;flex-direction:column;gap:2px}
.side h4{margin:14px 12px 4px;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;text-align:left;width:100%;font-weight:500}
.nav:hover{background:#fff}
.nav.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
.nav .n{margin-left:auto;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.side-actions{margin-top:14px;display:grid;gap:8px;padding:0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:12px;font-weight:700;background:#fff;border:1px solid var(--line)}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:var(--brand-2)}
.btn.small{padding:6px 10px;font-size:.85rem;border-radius:10px}
.btn.danger{color:#b3261e}
.hint{font-size:.78rem;color:var(--muted);padding:2px 8px}

/* ---------- recherche ---------- */
.searchrow{display:flex;gap:12px;margin-bottom:16px}
.search{flex:1;display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;min-width:0}
.search:focus-within{border-color:var(--brand)}
.search input{flex:1;border:0;outline:0;background:none;padding:13px 0;font-size:1.05rem;min-width:0}
.seg{display:flex;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:3px}
.seg button{padding:8px 14px;border-radius:10px;font-weight:700;white-space:nowrap}
.seg button.on{background:var(--brand);color:#fff}

/* ---------- grille ---------- */
.count{color:var(--muted);font-size:.88rem;margin:0 2px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-align:left;display:flex;flex-direction:column;position:relative;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card .ph{aspect-ratio:1/1;overflow:hidden;background:linear-gradient(180deg,#fff,#f8eef1);display:grid;place-items:center;padding:10px}
.card .ph img{width:100%;height:100%;min-height:0;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.12))}
.card .tx{padding:10px 12px 12px;border-top:1px solid var(--line)}
.card b{display:block;font-size:.98rem;line-height:1.25}
.card small{color:var(--muted);display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .dots{display:flex;gap:6px;margin-top:8px;align-items:center;font-size:.74rem;color:var(--muted)}
.bar{flex:1;height:5px;background:var(--brand-soft);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:9px}
.card .heart{position:absolute;top:8px;right:8px;color:var(--brand)}
.card .heart svg{fill:var(--brand)}
.noimg{color:#d3b9c1;display:grid;place-items:center;gap:4px;font-size:.8rem}
.noimg svg{width:44px;height:44px}
.empty{background:#fff;border:1.5px dashed var(--line);border-radius:var(--radius);padding:40px 20px;text-align:center;color:var(--muted)}

/* ---------- fiche ---------- */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--brand);font-weight:700;margin-bottom:12px;padding:6px 10px 6px 4px;border-radius:10px}
.back:hover{background:var(--brand-soft)}
.hero{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:24px;margin-bottom:18px}
.photo{background:#fff;border:1px solid var(--line);border-radius:var(--radius);aspect-ratio:4/3;display:grid;place-items:center;padding:22px;overflow:hidden}
.photo img{width:100%;height:100%;min-height:0;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(0,0,0,.14))}
.thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.thumb{width:64px;height:48px;border-radius:10px;border:2px solid var(--line);background:#fff;padding:3px;display:grid;place-items:center;overflow:hidden;flex:none}
.thumb.on{border-color:var(--brand)}
.thumb img{width:100%;height:100%;min-height:0;object-fit:contain}
.thumb.add{border-style:dashed;color:var(--brand);cursor:pointer}
.hero h1{margin:4px 0 2px;font-size:clamp(1.6rem,3.4vw,2.3rem);color:var(--brand);letter-spacing:-.02em;line-height:1.1}
.hero .dci{font-size:1.05rem;margin:0 0 4px}
.hero .forme{color:var(--muted);margin:0 0 12px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tag{padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:.88rem}
.tag.cat{background:var(--brand-soft);border-color:var(--brand-soft);color:var(--brand);font-weight:600}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.fav-btn.on svg{fill:var(--brand);stroke:var(--brand)}
.titleline{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}

.secs{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.sec{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;grid-column:span 2;min-width:0}
.sec.w3{grid-column:span 3}
.sec.pink{background:var(--brand-softer);border-color:var(--brand-soft)}
.sec.green{background:var(--green-soft);border-color:var(--green-line)}
.sec header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sec h3{margin:0;font-size:1.02rem;color:var(--brand);flex:1}
.sec.green h3{color:#24400f}
.sec.green header svg{color:var(--green)}
.sec header svg{color:var(--brand)}
.sec ul{margin:0;padding-left:20px}
.sec li{margin:3px 0;overflow-wrap:anywhere}
.sec .todo{display:block;width:100%;text-align:left;color:var(--muted);font-style:italic;padding:8px 10px;border:1.5px dashed var(--line);border-radius:10px;background:rgba(255,255,255,.6)}
.sec .todo:hover{border-color:var(--brand);color:var(--brand)}
.sec textarea,.jadd textarea,.jitem textarea{width:100%;min-height:120px;border:1.5px solid var(--brand);border-radius:10px;padding:10px;background:#fff;resize:vertical;outline:0;line-height:1.45}
.sec .edit-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:rgba(138,21,56,.08);color:var(--brand)}
.card .loc{display:inline-flex;align-items:center;gap:3px;margin-top:6px;font-size:.76rem;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:99px;padding:2px 8px 2px 5px}
.card .loc svg{width:13px;height:13px}
.card .pregb{position:absolute;top:8px;left:8px;line-height:0}
.tag.locb{display:inline-flex;align-items:center;gap:4px;background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
.tag.locb svg{width:15px;height:15px}
.tag.cls{background:#eef1fb;border-color:#d9def5;color:#2b3a8c;font-weight:600}
button.tag:hover{border-color:var(--brand)}
.kv{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
.kv b{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:4px}
.preg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 14px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:14px}
.preg b{display:flex;align-items:center;gap:8px;margin-right:6px}
.preg button{padding:5px 11px;border-radius:99px;border:1.5px solid var(--line);font-size:.86rem;font-weight:600;color:var(--muted)}
.preg button.on{background:var(--c);border-color:var(--c);color:#fff}
.stamp{color:var(--muted);font-size:.8rem;margin-top:14px}

/* ---------- carnet ---------- */
.jadd{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:16px}
.jadd textarea{min-height:90px}
.jadd .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.jitem{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.jitem .meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.82rem;margin-bottom:4px}
.jitem .meta span{flex:1}
.jitem p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
h2.page{margin:0 0 4px;color:var(--brand);font-size:1.5rem}
p.lead{margin:0 0 14px;color:var(--muted)}

/* ---------- fenêtre ---------- */
dialog{border:0;border-radius:20px;padding:0;width:min(520px,calc(100vw - 24px));box-shadow:0 30px 80px rgba(60,10,25,.35)}
dialog::backdrop{background:rgba(60,10,25,.4)}
dialog form{padding:20px;display:grid;gap:12px}
dialog h2{margin:0;color:var(--brand)}
label{display:grid;gap:4px;font-weight:600;font-size:.9rem}
label input{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:400;background:#fff}
label input:focus{border-color:var(--brand);outline:0}
label small{font-weight:400;color:var(--muted)}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.dlg-foot .danger{margin-right:auto}
.banner{background:#fff4e5;border:1px solid #f3d19c;color:#7a4a00;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.9rem}

/* ---------- mobile ---------- */
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);gap:12px;padding:12px}
  .side{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:none;margin:0 -12px;padding:0 12px 4px}
  .side::-webkit-scrollbar{display:none}
  .side h4{display:none}
  .nav{width:auto;white-space:nowrap;background:#fff;border:1px solid var(--line);padding:7px 12px;border-radius:99px;flex:none}
  .nav.on{border-color:var(--brand-soft)}
  .nav .n{margin-left:4px}
  .side-actions{display:flex;margin:0;padding:0;flex:none}
  .side-actions .btn{border-radius:99px;padding:7px 12px;white-space:nowrap}
  .side .hint{display:none}
  .hero{grid-template-columns:minmax(0,1fr);gap:14px}
  .sec,.sec.w3{grid-column:span 6}
  .tab b{display:none}
  .logo{font-size:1.1rem}
  .searchrow{flex-direction:column;gap:8px}
  .seg button{flex:1}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .side.in-detail{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <span class="save-state" id="saveState">Enregistré ✓</span>

    <button class="tab" data-tab="carnet"><svg class="i" viewBox="0 0 24 24"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2zM9 8h6M9 12h6"/></svg><b>Carnet de stage</b></button>
  </nav>
</div></header>

<div class="app">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
</div>

<dialog id="dlg"></dialog>
<input type="file" id="filePhoto" accept="image/*" hidden>
<input type="file" id="fileImport" accept="application/json,.json" hidden>

   Stockage (IndexedDB : dans ce navigateur, sur cet appareil)
   ===================================================================== */
let db=null, persist=true;
function openDb(){return new Promise((res,rej)=>{
  const r=indexedDB.open("mon-comptoir",1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("meds",{keyPath:"id"});d.createObjectStore("journal",{keyPath:"id"});};
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
});}
function store(name,mode,fn){return new Promise((res,rej)=>{
  const t=db.transaction(name,mode); const q=fn(t.objectStore(name));
  t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
});}
let saveTimer=null;
function flashSaved(){const el=document.getElementById("saveState");el.classList.add("show");clearTimeout(saveTimer);saveTimer=setTimeout(()=>el.classList.remove("show"),1400);}
async function put(name,obj){ if(!persist) return; try{await store(name,"readwrite",s=>s.put(obj));flashSaved();}catch(e){persist=false;render();} }
async function del(name,id){ if(!persist) return; try{await store(name,"readwrite",s=>s.delete(id));flashSaved();}catch(e){persist=false;render();} }

  pen:'<path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3"/>', back:'<path d="M15 5l-7 7 7 7"/>', down:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>', up:'<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>',
  trash:'<path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>', box:'<rect x="3" y="8" width="18" height="12" rx="2"/><path d="M8 8V5h8v3M12 11v6M9 14h6"/>',
};

   ===================================================================== */
const $side=document.getElementById("side"), $main=document.getElementById("main"), $dlg=document.getElementById("dlg");

function groups(get){const c={};meds.forEach(m=>get(m).forEach(k=>{if(k)c[k]=(c[k]||0)+1}));return Object.entries(c).sort((a,b)=>a[0].localeCompare(b[0],"fr"));}
const squash=s=>norm(s).replace(/[\s\-'’./]+/g,"");
function hay(m){return [m.nom,m.dci,m.forme,m.cat,m.emplacement,(m.classe||[]).join(" "),(m.sympt||[]).join(" "),(m.tags||[]).join(" ")].join(" ");}
function matches(m,q){const h=norm(hay(m));if(q.split(/\s+/).every(w=>h.includes(w)))return true;const sq=squash(q);return sq.length>2&&squash(hay(m)).includes(sq);}
function cats(){const c={};meds.forEach(m=>{const k=m.cat||"Sans catégorie";c[k]=(c[k]||0)+1});return Object.entries(c).sort((a,b)=>a[0].localeCompare(b[0],"fr"));}

function visible(){
  let l=meds.slice();
  const f=ui.filter;
  if(f==="fav") l=l.filter(m=>m.fav);
  else if(f==="recent") l=l.filter(m=>m.viewed).sort((a,b)=>b.viewed-a.viewed).slice(0,12);
  else if(f==="todo") l=l.filter(m=>filled(m)===0);
  else if(f.startsWith("cat:")) l=l.filter(m=>(m.cat||"Sans catégorie")===f.slice(4));
  else if(f.startsWith("cls:")) l=l.filter(m=>(m.classe||[]).includes(f.slice(4)));
  else if(f.startsWith("sym:")) l=l.filter(m=>(m.sympt||[]).includes(f.slice(4)));
  else if(f.startsWith("loc:")) l=l.filter(m=>(m.emplacement||"")===f.slice(4));
  const q=norm(ui.q.trim());
  if(q) l=l.filter(m=>matches(m,q));
  if(f!=="recent") l.sort((a,b)=>a.nom.localeCompare(b.nom,"fr"));
  return l;
}

function renderSide(){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.tab===ui.tab));
  $side.classList.toggle("in-detail",!!ui.openId||ui.tab!=="meds");
  if(ui.tab!=="meds"){ $side.innerHTML=sideActions(); return; }
  const nav=(f,ic,label,n)=>`<button class="nav ${ui.filter===f&&!ui.openId?"on":""}" data-filter="${esc(f)}">${I(ic)}${esc(label)}<span class="n">${n}</span></button>`;
  $side.innerHTML=
    nav("all",IC.search,"Tous",meds.length)+
    nav("fav",IC.star,"Favoris",meds.filter(m=>m.fav).length)+
    nav("recent",IC.clock,"Récents",Math.min(12,meds.filter(m=>m.viewed).length))+
    nav("todo",IC.todo,"À compléter",meds.filter(m=>filled(m)===0).length)+
    `<h4>Catégories</h4>`+cats().map(([c,n])=>nav("cat:"+c,IC.folder,c,n)).join("")+
    `<h4>Classes</h4>`+groups(m=>m.classe||[]).map(([c,n])=>nav("cls:"+c,IC.flask,c,n)).join("")+
    `<h4>Emplacements</h4>`+groups(m=>[m.emplacement]).map(([c,n])=>nav("loc:"+c,IC.pin,c,n)).join("")+sideActions();
}
function sideActions(){return `<div class="side-actions">
  <button class="btn primary" data-act="new">${I(IC.plus)}Ajouter</button>

function banner(){return persist?"":`<div class="banner">⚠️ Ce navigateur bloque l'enregistrement (navigation privée ?). Tes notes seront perdues à la fermeture : utilise « Sauvegarder » ou ouvre la page dans une fenêtre normale.</div>`;}

function photoBox(m,ix=0){

}

function renderList(){

      ${m.dci?`<p class="dci"><b>DCI :</b> ${esc(m.dci)}</p>`:`<p class="dci" style="color:var(--muted)">DCI à renseigner</p>`}

      ${(m.sympt||[]).length?`<p class="kv"><b>Symptômes</b>${m.sympt.map(t=>`<button class="tag" data-find="${esc(t)}">${esc(t)}</button>`).join("")}</p>`:""}
      <div class="preg"><b>${pregIcon(m.grossesse||"",30)} Grossesse</b>${Object.entries(PREG).map(([k,[lab,col]])=>`<button data-preg="${k}" class="${(m.grossesse||"")===k?"on":""}" style="--c:${col}">${lab}</button>`).join("")}</div>
      <div class="hero-actions"><button class="btn" data-act="editmed">${I(IC.pen)}Modifier la fiche</button></div>

  const ta=$main.querySelector("textarea[data-sec]"); if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}

function secHtml(m,s){
  const val=m.sections[s.k]||"", ls=lines(val), ed=ui.editing===s.k;

  if(ed) body=`<textarea data-sec="${s.k}" placeholder="${esc(s.ph)}">${esc(val)}</textarea>
     <div class="edit-foot"><small style="color:var(--muted)">Une ligne = un point · enregistré automatiquement</small><button class="btn small primary" data-act="done">Terminer</button></div>`;
  else if(ls.length) body=`<ul>${ls.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>`;
  else body=`<button class="todo" data-edit="${s.k}">${esc(s.ph)} Appuie pour écrire.</button>`;

}

function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  ui.editing=null; ui.jedit=null;
  if(h==="carnet"){ui.tab="carnet";ui.openId=null;}
  else if(h.startsWith("m/")){
    ui.tab="meds"; const id=h.slice(2);
    if(ui.openId!==id){ui.openId=id;ui.photoIx=0;const m=meds.find(x=>x.id===id);if(m){m.viewed=Date.now();put("meds",m);}}
  } else {ui.tab="meds";ui.openId=null;}
  render(); window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);

/* =====================================================================
   Actions
   ===================================================================== */
function current(){return meds.find(x=>x.id===ui.openId);}
function touch(m){m.updated=Date.now();put("meds",m);}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-filter],[data-open],[data-act],[data-edit],[data-photo],[data-jedit],[data-jdel],[data-preg],[data-find]");
  if(!t) return;
  const d=t.dataset, m=current();
  if(d.tab){location.hash=d.tab==="carnet"?"carnet":"";return;}
  if(d.filter){ui.filter=d.filter;ui.q="";if(location.hash) location.hash=""; else render();return;}
  if(d.open){location.hash="m/"+encodeURIComponent(d.open);return;}
  if(d.preg!==undefined){m.grossesse=d.preg;touch(m);renderDetail();return;}
  if(d.find){ui.filter="all";ui.q=d.find;if(location.hash) location.hash=""; else render();return;}
  if(d.edit){ui.editing=d.edit;renderDetail();return;}
  if(d.photo){ui.photoIx=+d.photo;renderDetail();return;}
  if(d.jedit){ui.jedit=d.jedit;renderCarnet();return;}
  if(d.jdel){if(confirm("Supprimer cette note ?")){journal=journal.filter(j=>j.id!==d.jdel);del("journal",d.jdel);renderCarnet();}return;}
  switch(d.act){
    case "back": history.length>1&&document.referrer===""?(location.hash=""):(location.hash=""); break;
    case "done": ui.editing=null; renderDetail(); renderSide(); break;
    case "fav": m.fav=!m.fav; put("meds",m); render(); break;
    case "addphoto": document.getElementById("filePhoto").click(); break;
    case "delphoto": if(confirm("Retirer cette photo de la fiche ?")){m.photos.splice(ui.photoIx,1);ui.photoIx=0;touch(m);renderDetail();} break;
    case "editmed": openForm(m); break;
    case "new": openForm(null); break;
    case "export": exportAll(); break;
    case "import": document.getElementById("fileImport").click(); break;
    case "jadd": {const ta=document.getElementById("jtext"),v=ta.value.trim();if(!v){ta.focus();break;}
      const j={id:"j"+Date.now(),ts:Date.now(),text:v};journal.push(j);put("journal",j);renderCarnet();break;}
    case "jdone": ui.jedit=null; renderCarnet(); break;
  }
});

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){ui.q=t.value;const l=visible();document.getElementById("grid").innerHTML=gridHtml(l);
    document.querySelector(".count").lastChild.textContent=` · ${l.length} fiche${l.length>1?"s":""}`;return;}
  if(t.dataset.sec){const m=current();m.sections[t.dataset.sec]=t.value;touch(m);return;}
  if(t.dataset.jtext){const j=journal.find(x=>x.id===t.dataset.jtext);j.text=t.value;put("journal",j);}
});

/* ----- photos : redimensionnées avant d'être enregistrées ----- */
function shrink(file,max=1000){return new Promise((res,rej)=>{
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    res(c.toDataURL("image/jpeg",.85));};im.onerror=rej;im.src=r.result;};
  r.onerror=rej;r.readAsDataURL(file);});}
document.getElementById("filePhoto").addEventListener("change",async e=>{
  const f=e.target.files[0], m=current(); e.target.value=""; if(!f||!m) return;
  try{m.photos=m.photos||[];m.photos.push(await shrink(f));ui.photoIx=m.photos.length-1;touch(m);renderDetail();}
  catch(err){alert("Impossible de lire cette image.");}
});

/* ----- formulaire fiche ----- */
function openForm(m){
  const isNew=!m; m=m||{nom:"",dci:"",forme:"",cat:ui.filter.startsWith("cat:")?ui.filter.slice(4):"",tags:[],classe:[],sympt:[],emplacement:ui.filter.startsWith("loc:")?ui.filter.slice(4):""};
  $dlg.innerHTML=`<form method="dialog" id="medForm">
    <h2>${isNew?"Nouveau médicament":"Modifier la fiche"}</h2>
    <label>Nom commercial<input name="nom" required value="${esc(m.nom)}" placeholder="ex. Dafalgan 1 g"></label>
    <label>DCI (substance active)<input name="dci" value="${esc(m.dci)}" placeholder="ex. Paracétamol 1 g"></label>
    <label>Forme / conditionnement<input name="forme" value="${esc(m.forme)}" placeholder="ex. 30 comprimés pelliculés"></label>
    <label>Catégorie<input name="cat" list="catlist" value="${esc(m.cat)}" placeholder="ex. Douleur & fièvre">
      <datalist id="catlist">${cats().map(([c])=>`<option value="${esc(c)}">`).join("")}</datalist></label>
    <label>Classe <small>séparées par des virgules</small><input name="classe" value="${esc((m.classe||[]).join(", "))}" placeholder="ex. Antihistaminique"></label>
    <label>Symptômes <small>séparés par des virgules</small><input name="sympt" value="${esc((m.sympt||[]).join(", "))}" placeholder="ex. Rhume des foins, Urticaire"></label>
    <label>Emplacement<input name="emplacement" value="${esc(m.emplacement||"")}" placeholder="ex. A13"></label>
    <label>Étiquettes <small>séparées par des virgules</small><input name="tags" value="${esc((m.tags||[]).join(", "))}" placeholder="ex. Sans ordonnance, Sirop"></label>
    <div class="dlg-foot">
      ${isNew?"":`<button type="button" class="btn danger" id="delMed">${I(IC.trash)}Supprimer</button>`}
      <button type="button" class="btn" id="cancelMed">Annuler</button>
      <button class="btn primary" value="ok">${isNew?"Créer la fiche":"Enregistrer"}</button>
    </div></form>`;
  $dlg.showModal();
  document.getElementById("cancelMed").onclick=()=>$dlg.close();
  if(!isNew) document.getElementById("delMed").onclick=()=>{
    if(!confirm(`Supprimer définitivement la fiche « ${m.nom} » et toutes ses notes ?`)) return;
    meds=meds.filter(x=>x.id!==m.id);del("meds",m.id);$dlg.close();location.hash="";render();};
  document.getElementById("medForm").onsubmit=()=>{
    const f=new FormData(document.getElementById("medForm")),g=k=>String(f.get(k)||"").trim();
    const data={nom:g("nom"),dci:g("dci"),forme:g("forme"),cat:g("cat"),emplacement:g("emplacement"),...Object.fromEntries(["tags","classe","sympt"].map(k=>[k,g(k).split(",").map(s=>s.trim()).filter(Boolean)]))};
    if(isNew){const n={id:"u"+Date.now(),...data,grossesse:"",photos:[],fav:false,sections:{},updated:0,viewed:0};meds.push(n);put("meds",n);location.hash="m/"+n.id;}
    else{Object.assign(m,data);put("meds",m);render();}
  };
}

/* ----- sauvegarde / restauration ----- */
async function exportAll(){
  const name="mon-comptoir-"+new Date().toISOString().slice(0,10)+".json";
  const dl=window.claude&&window.claude.use?await window.claude.use("downloads").catch(()=>null):null;
  if(dl){try{await dl.save({filename:name,data:JSON.stringify({app:"mon-comptoir",version:1,date:new Date().toISOString(),meds,journal})});}
    catch(e){if(e&&e.code!=="declined") alert("La sauvegarde n'a pas pu être créée ici.");}
    return;}
  const blob=new Blob([JSON.stringify({app:"mon-comptoir",version:1,date:new Date().toISOString(),meds,journal})],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="mon-comptoir-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
document.getElementById("fileImport").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{
    const d=JSON.parse(await f.text());
    if(d.app!=="mon-comptoir"||!Array.isArray(d.meds)) throw 0;
    if(!confirm(`Restaurer ${d.meds.length} fiches et ${(d.journal||[]).length} notes de carnet ?\nLes fiches du même nom d'origine seront remplacées par celles du fichier.`)) return;
    for(const m of d.meds){ if(!m||!m.id||!m.nom) continue; m.sections=m.sections||{};m.photos=m.photos||[];m.tags=m.tags||[];
      const i=meds.findIndex(x=>x.id===m.id); if(i>=0) meds[i]=m; else meds.push(m); await put("meds",m); }
    for(const j of d.journal||[]){ if(!j||!j.id) continue; const i=journal.findIndex(x=>x.id===j.id); if(i>=0) journal[i]=j; else journal.push(j); await put("journal",j); }
    render();
  }catch(err){alert("Ce fichier n'est pas une sauvegarde Mon Comptoir valide.");}
});

/* =====================================================================
   Démarrage
   ===================================================================== */
(async function(){
  try{
    db=await openDb();
    meds=await store("meds","readonly",s=>s.getAll());
    journal=await store("journal","readonly",s=>s.getAll());
    if(localStorage.getItem("mon-comptoir-seed")!=="2"){
      /* retire les anciennes fiches à photos générées (gardées seulement si tu y as écrit des notes) et ajoute le rayon A13 */
      for(const m of meds.slice()){ if(/^s\d+$/.test(m.id)){
        if(Object.values(m.sections||{}).some(v=>String(v||"").trim())){m.photos=(m.photos||[]).filter(p=>!p.startsWith("seed:"));await store("meds","readwrite",s=>s.put(m));}
        else{meds=meds.filter(x=>x!==m);await store("meds","readwrite",s=>s.delete(m.id));} } }
      for(const s of SEED){ if(!meds.some(m=>m.id===s.id)){const n=JSON.parse(JSON.stringify(s));meds.push(n);await store("meds","readwrite",st=>st.put(n));} }
      localStorage.setItem("mon-comptoir-seed","2");
    }
    if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();
  }catch(e){ persist=false; meds=SEED.map(m=>JSON.parse(JSON.stringify(m))); }
  meds.forEach(m=>{m.sections=m.sections||{};m.classe=m.classe||[];m.sympt=m.sympt||[];m.photos=(m.photos||[]).filter(p=>img(p));});
  route();
})();
</script>
</body>
